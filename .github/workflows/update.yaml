name: Update Flake Inputs
on:
  schedule:
    - cron: '0 0 * * 6'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v5

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Update flake inputs
        run: nix flake update 2>&1 | tee flake-update.log

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet flake.lock; then
            echo "No changes to flake.lock"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "flake.lock updated"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Write input change report
        if: steps.check.outputs.changed == 'true'
        run: |
          {
            echo "## Flake input changes"
            echo ""
            echo '```'
            cat flake-update.log
            echo '```'
          } > inputs.md
          cat inputs.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload flake.lock and input report
        if: steps.check.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: update-output
          path: |
            flake.lock
            inputs.md
          retention-days: 1

  build-linux:
    runs-on: ubuntu-latest
    needs: update
    if: needs.update.outputs.changed == 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Save baseline flake.lock
        run: cp flake.lock /tmp/flake.lock.baseline

      - uses: actions/download-artifact@v8
        with:
          name: update-output

      - name: Save new flake.lock
        run: cp flake.lock /tmp/flake.lock.new

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Build and report
        run: |
          .github/scripts/build-report.sh \
            x86_64-linux nixosConfigurations \
            /tmp/flake.lock.baseline /tmp/flake.lock.new \
            linux-report.md
          cat linux-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: report-linux
          path: linux-report.md
          retention-days: 1

  build-darwin:
    runs-on: macos-latest
    needs: update
    if: needs.update.outputs.changed == 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Save baseline flake.lock
        run: cp flake.lock /tmp/flake.lock.baseline

      - uses: actions/download-artifact@v8
        with:
          name: update-output

      - name: Save new flake.lock
        run: cp flake.lock /tmp/flake.lock.new

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Build and report
        run: |
          .github/scripts/build-report.sh \
            aarch64-darwin darwinConfigurations \
            /tmp/flake.lock.baseline /tmp/flake.lock.new \
            darwin-report.md
          cat darwin-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: report-darwin
          path: darwin-report.md
          retention-days: 1

  pr:
    runs-on: ubuntu-latest
    needs: [update, build-linux, build-darwin]
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download input report
        uses: actions/download-artifact@v8
        with:
          name: update-output

      - name: Assemble PR body
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            cat inputs.md
            echo ""
            echo "Closure diffs, build summaries, and per-derivation timings: see the [workflow run](${run_url}) step summary."
          } > pr-body.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "git.bot@yanlincs.com"
          git checkout -B flake-update
          git add flake.lock
          git commit -m "update flake inputs"
          git push -f origin flake-update

      - name: Create or update pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh pr list --head flake-update --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "PR #${existing} already exists, updating body"
            gh pr edit "$existing" --body-file pr-body.md
          else
            gh pr create --title "Update flake inputs" --body-file pr-body.md --head flake-update --base master
          fi
