name: Update Flake Inputs
on:
  schedule:
    - cron: '0 13 * * 5'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Send start notification
        run: curl -s -d "Nix flake update started" https://ntfy.sh/yanlincs-homelab

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Update flake inputs
        run: nix flake update

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet flake.lock; then
            echo "No changes to flake.lock"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "flake.lock updated"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check config syntax
        if: steps.check.outputs.changed == 'true'
        run: |
          nix eval .#nixosConfigurations --apply 'builtins.mapAttrs (_: v: v.config.system.build.toplevel.drvPath)' --json > /dev/null
          nix eval .#darwinConfigurations --apply 'builtins.mapAttrs (_: v: v.config.system.build.toplevel.drvPath)' --json > /dev/null
          nix eval .#homeConfigurations --apply 'builtins.mapAttrs (_: v: v.activationPackage.drvPath)' --json > /dev/null

      - name: Build NixOS configs
        if: steps.check.outputs.changed == 'true'
        run: |
          for host in $(nix eval .#nixosConfigurations --apply 'x: builtins.attrNames x' --json | jq -r '.[]'); do
            echo "Building nixosConfigurations.${host}..."
            nix build ".#nixosConfigurations.${host}.config.system.build.toplevel" --no-link
          done

      - name: Build Linux Home Manager configs
        if: steps.check.outputs.changed == 'true'
        run: |
          for config in $(nix eval .#homeConfigurations --apply 'x: builtins.attrNames x' --json | jq -r '.[]'); do
            pkg_system=$(nix eval ".#homeConfigurations.\"${config}\".activationPackage.system" --raw 2>/dev/null || true)
            if [ "$pkg_system" = "x86_64-linux" ]; then
              echo "Building homeConfigurations.${config}..."
              nix build ".#homeConfigurations.\"${config}\".activationPackage" --no-link
            fi
          done

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "git.bot@yanlincs.com"
          git checkout -B flake-update
          git add flake.lock
          git commit -m "update flake inputs"
          git push -f origin flake-update

      - name: Create or update pull request
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh pr list --head flake-update --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "PR #${existing} already exists"
          else
            gh pr create --title "Update flake inputs" --body "Automated flake input update." --head flake-update --base master
          fi

      - name: Send notification
        if: always()
        run: curl -s -d "Nix flake update ${{ job.status }}" https://ntfy.sh/yanlincs-homelab
