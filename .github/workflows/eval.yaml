# Evaluates every system and home configuration for both platforms on each push.
# A change that fails to evaluate is caught here before it lands.
name: evaluate
on: [push]

jobs:
  evaluate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
            host-attr: nixosConfigurations
          - os: macos-latest
            system: aarch64-darwin
            host-attr: darwinConfigurations
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Evaluate ${{ matrix.host-attr }}
        run: |
          # Mapping each configuration to its derivation path forces a full evaluation without building it.
          nix eval ".#${{ matrix.host-attr }}" \
            --apply 'builtins.mapAttrs (_: v: v.config.system.build.toplevel.drvPath)' \
            --json > /dev/null

      - name: Evaluate matching home configs
        run: |
          # Each runner evaluates only the home configurations that belong to its own platform.
          for config in $(nix eval .#homeConfigurations --apply 'x: builtins.attrNames x' --json | jq -r '.[]'); do
            sys=$(nix eval ".#homeConfigurations.\"${config}\".activationPackage.system" --raw 2>/dev/null || true)
            if [ "$sys" = "${{ matrix.system }}" ]; then
              echo "Evaluating homeConfigurations.${config}..."
              nix eval ".#homeConfigurations.\"${config}\".activationPackage.drvPath" --raw > /dev/null
            fi
          done
